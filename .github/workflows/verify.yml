name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Fetch the exact revision that triggered the workflow.
      - name: Checkout
        uses: actions/checkout@v4

      # Use the same supported Node line as local development.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run syntax, consistency, and unit checks without external packages.
      - name: Verify
        run: npm run verify

  native-core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Compile the same tracking core on both final desktop platforms.
      - name: Checkout
        uses: actions/checkout@v4

      # Configure without the private Adobe SDK so the algorithm stays portable.
      - name: Configure native core
        run: cmake -S native -B native/build -DBUILD_TESTING=ON

      # Build and run the deterministic point-tracking tests.
      - name: Build native core
        run: cmake --build native/build --config Release

      - name: Test native core
        run: ctest --test-dir native/build -C Release --output-on-failure
