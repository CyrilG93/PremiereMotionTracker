name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Fetch the exact revision that triggered the workflow.
      - name: Checkout
        uses: actions/checkout@v4

      # Use the same supported Node line as local development.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run syntax, consistency, and unit checks without external packages.
      - name: Verify
        run: npm run verify

